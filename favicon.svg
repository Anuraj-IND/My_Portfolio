<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: dark code editor style -->
  <rect width="64" height="64" rx="10" fill="#1a1a2e"/>

  <!-- Terminal prompt line 1 -->
  <circle cx="13" cy="20" r="3.5" fill="#ff79c6"/>
  <line x1="19" y1="20" x2="51" y2="20" stroke="#8be9fd" stroke-width="3" stroke-linecap="round"/>

  <!-- Bracket left < -->
  <text x="8" y="38" font-family="monospace" font-size="14" font-weight="bold" fill="#ff79c6">&lt;</text>

  <!-- Bracket right /> -->
  <text x="34" y="38" font-family="monospace" font-size="14" font-weight="bold" fill="#50fa7b">/&gt;</text>

  <!-- Terminal prompt line 2 -->
  <circle cx="13" cy="50" r="2.5" fill="#f1fa8c"/>
  <line x1="19" y1="50" x2="40" y2="50" stroke="#a8e6cf" stroke-width="3" stroke-linecap="round"/>
  <!-- Cursor blink block -->
  <rect x="42" y="44" width="6" height="10" rx="1" fill="#bd93f9"/>
</svg>
